# ═══════════════════════════════════════════════════════════════
# DEFAULT STACK — PORTFOLIO DEMO (light)
# web (nginx) + mock-api (faker dummy data).
# `docker compose up -d --build` boots the whole demo with zero
# configuration: no PostgreSQL, no real API, no .env, no secrets.
#
# The mock-api joins the network under the alias `api` so the
# nginx /api → api:3000 proxy works unchanged.
#
# The real full stack (Express API + PostgreSQL + autoheal) is
# REFERENCE ONLY in docker-compose.full.yml — never deployed for
# the portfolio demo.
# ═══════════════════════════════════════════════════════════════
services:
  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    image: eom-mock-api:latest
    container_name: eom-mock-api
    restart: always
    ports:
      - '4000:3000'
    environment:
      MOCK_API_PORT: '3000'
      TZ: Asia/Jakarta
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/system/health'', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1));"',
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      demo-network:
        aliases:
          - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Use same-origin API proxy so HTTPS/external domains do not call localhost.
        VITE_API_URL: /api
        VITE_APP_MODE: demo
        VITE_IT_SUPPORT_URL: ${VITE_IT_SUPPORT_URL:-}
        VITE_IT_SUPPORT_EMAIL: ${VITE_IT_SUPPORT_EMAIL:-}
    image: eom-web:latest
    container_name: eom-web
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      - mock-api
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:5173/ || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge
